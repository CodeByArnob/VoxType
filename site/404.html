<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found • VoxType</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="shortcut icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #38BDF8 0%, #2563EB 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="error-container">
    <div class="brand-badge mb-4">
      <img src="./assets/icon.png" alt="VoxType Logo" width="28" height="28">
      <span>VoxType</span>
    </div>
    <h1 class="error-code">404</h1>
    <h2 class="section-title mt-2">Page Not Found</h2>
    <p class="section-subtitle max-w-md mt-2">The page or resource you are looking for does not exist or has been moved.</p>
    <div class="cta-group mt-6">
      <a href="./" class="btn btn-primary">Return to VoxType Home</a>
      <a href="https://github.com/CodeByArnob/VoxType" class="btn btn-secondary" target="_blank" rel="noopener">View GitHub Repository</a>
    </div>
  </div>
</body>
</html>
